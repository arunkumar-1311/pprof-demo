groups:
  - name: pprof-demo
    rules:
      - alert: AppDown
        expr: up{job="pprof-demo"} == 0
        for: 15s
        annotations:
          summary: pprof-demo is not reachable

      - alert: GoroutineLeak
        # Goroutine count still rising after 5 minutes of steady growth: /api/goroutine leak.
        expr: deriv(go_goroutines{job="pprof-demo"}[5m]) > 1 and go_goroutines{job="pprof-demo"} > 500
        for: 1m
        annotations:
          summary: Goroutines keep growing - take /debug/pprof/goroutine

      - alert: HeapGrowing
        # Heap still rising: /api/leak. Take /debug/pprof/heap and diff.
        expr: deriv(go_memstats_heap_inuse_bytes{job="pprof-demo"}[5m]) > 1e6
        for: 2m
        annotations:
          summary: Heap in use keeps growing - take /debug/pprof/heap

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(pprofdemo_http_request_duration_seconds_bucket[1m]))) > 1
        for: 1m
        annotations:
          summary: p95 latency above 1s - take /debug/pprof/profile
